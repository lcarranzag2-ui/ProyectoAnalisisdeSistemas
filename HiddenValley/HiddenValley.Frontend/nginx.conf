# tuvimos un problema al probar el dashboard: cuando entrabas directo a /dashboard
# nginx devolvía 404 porque buscaba el archivo fisico y no lo encontraba.
# la solucion fue agregar este archivo de configuracion con try_files para que
# cualquier ruta que no sea un archivo estatico redirija al index.html
# y blazor se encargue de manejar la navegacion del lado del cliente

events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;

        root /usr/share/nginx/html;
        index index.html;

        # necesario para que Blazor WebAssembly maneje sus propias rutas
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
